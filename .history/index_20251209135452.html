<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <nav>
            <div class="left">KANBAN</div>
            <div class="right"><button id="">Add new Task</button></div>
        </nav>
        <section class="board">
            <div   id="todo" class="task-column">
                <div class="heading">
                    <div class="left">To do </div>
                      <div class="right">count</div>
                </div>
                <div draggable="true" class="task">
                    <h3>Task 1</h3>
                    <p>Descriptio for the task 1 </p>
                    <button>Delete</button>
                </div>
            </div>
            <div id="progress" class="task-column">
                <div class="heading">
                    <div class="left">In Progress</div>
                    <div class="right">count</div>
                </div>
                   
            </div>
            <div  id="done"   class="task-column">
                <div class="heading">
                    <div class="left">IS Done </div>
                    <div class="right"> count</div>
                </div>
                 
            </div>
        </section>


    </main>

    <div class="modal add-new-tast">
        <input type="text" placeholder="Task title"/>
        <textarea placeholder="Task Description"></textarea>
        <button id="add-new-task" class="add-task-btn"> Add Task</button>
    </div>
    <script src="kanban.js"></script>
</body>
</html>
